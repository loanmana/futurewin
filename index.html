<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Management System</title>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--bg:#f1f5f9;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:#1e293b}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:100}
.loginBox{background:#fff;padding:32px;border-radius:16px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginBox h2{color:var(--p);margin-bottom:4px;text-align:center}
.loginBox p{text-align:center;color:#64748b;font-size:13px;margin-bottom:16px}
.loginBox img{display:block;margin:0 auto 10px;max-height:70px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--p);color:#fff;padding:16px 0;position:fixed;top:0;bottom:0;overflow-y:auto}
aside .brand{padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:10px;text-align:center}
aside .brand img{max-height:56px;max-width:100%;background:#fff;border-radius:8px;padding:4px}
aside .brand div{font-weight:700;margin-top:6px;font-size:15px}
aside button{display:block;width:100%;text-align:left;background:none;border:none;color:#dbeafe;padding:9px 18px;font-size:14px;cursor:pointer}
aside button:hover,aside button.active{background:rgba(255,255,255,.15);color:#fff;border-left:4px solid #93c5fd}
main{margin-left:230px;flex:1;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{font-size:20px;color:var(--p)}
.userchip{background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:12px;padding:16px}
.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;opacity:.85}
.stat.green{background:linear-gradient(135deg,#14532d,#16a34a)}
.stat.red{background:linear-gradient(135deg,#7f1d1d,#dc2626)}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin-bottom:10px}
input:focus,select:focus{outline:2px solid var(--p2)}
.btn{background:var(--p2);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--p)}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn.gray{background:#64748b}.btn.xl{background:#0d7a3f}.btn.orange{background:#d97706}.btn.sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#e2e8f0;padding:9px;text-align:left;color:#334155}
td{padding:8px 9px;border-bottom:1px solid #e2e8f0}
tr:hover td{background:#f8fafc}
.badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.b-pending{background:#fef3c7;color:#92400e}.b-active{background:#dbeafe;color:#1e40af}.b-settled{background:#dcfce7;color:#166534}.b-over{background:#fee2e2;color:#991b1b}
h3.sec{color:var(--p);margin-bottom:12px;font-size:16px}
.secrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.secrow h3{color:var(--p);font-size:16px}
.cifItem{font-size:13px;padding:4px 0;border-bottom:1px dashed #e2e8f0}
.cifItem b{color:#475569;display:inline-block;min-width:130px}
.arrearsBox{background:#fee2e2;border:2px solid #dc2626;color:#991b1b;font-weight:700;padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:15px}
.pvBox{background:#eff6ff;border:2px solid #2563eb;border-radius:10px;padding:14px;margin-bottom:12px}
.pvBox .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #bfdbfe;font-size:14px}
.pvBox .row b.big{font-size:17px;color:#1e3a8a}
@media print{body *{visibility:hidden}#receiptArea,#receiptArea *{visibility:visible}#receiptArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <img id="loginLogo" src="" alt="" onerror="this.style.display='none'">
    <h2 id="loginCompany">Loan Management System</h2>
    <p>Sign in to continue</p>
    <div id="loginForm">
      <label>Username</label><input id="liUser">
      <label>Password</label><input id="liPass" type="password">
      <button class="btn" style="width:100%" onclick="login()">Login</button>
      <p style="margin-top:12px"><a href="#" onclick="toggleAuth(1)">Sign Up (new user)</a></p>
    </div>
    <div id="signupForm" class="hidden">
      <label>Full Name</label><input id="suName">
      <label>Username</label><input id="suUser">
      <label>Password</label><input id="suPass" type="password">
      <button class="btn green" style="width:100%" onclick="signup()">Sign Up</button>
      <p style="margin-top:12px"><a href="#" onclick="toggleAuth(0)">Back to Login</a></p>
    </div>
  </div>
</div>

<div id="app" class="hidden">
<aside>
  <div class="brand"><img id="sideLogo" src="" onerror="this.style.display='none'"><div id="sideCompany">My Company</div></div>
  <button onclick="nav('dashboard',this)" class="active">📊 Dashboard</button>
  <button onclick="nav('cif',this)">🔎 CIF</button>
  <button onclick="nav('customers',this)">👤 Customers</button>
  <button onclick="nav('groups',this)">👥 Groups</button>
  <button onclick="nav('products',this)">📦 Loan Products</button>
  <button onclick="nav('loans',this)">💰 Loans</button>
  <button onclick="nav('payments',this)">🧾 Payments</button>
  <button onclick="nav('duetoday',this)">📅 Due / Week Day</button>
  <button onclick="nav('ledger',this)">📒 Ledger</button>
  <button onclick="nav('collection',this)">📈 Collection Report</button>
  <button onclick="nav('monthly',this)">📆 Monthly Report</button>
  <button onclick="nav('profit',this)">💹 Profit Report</button>
  <button onclick="nav('officer',this)">🎯 Officer Targets</button>
  <button onclick="nav('users',this)">🔐 Users</button>
  <button onclick="nav('settings',this)">⚙️ Settings</button>
  <button onclick="logout()" style="color:#fecaca">🚪 Logout</button>
</aside>
<main>
  <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="userchip" id="userChip"></div></div>
  <div id="content"></div>
</main>
</div>

<div id="receiptArea"></div>

<script>// Firebase Configuration
const firebaseConfig = {
  apiKey: "AIzaSyBJvhscCIrI58fKW3MPF-oPJpDB6kAu-R4",
  authDomain: "futurewin-5ebf8.firebaseapp.com",
  databaseURL: "https://futurewin-5ebf8-default-rtdb.firebaseio.com",
  projectId: "futurewin-5ebf8",
  storageBucket: "futurewin-5ebf8.firebasestorage.app",
  messagingSenderId: "431053297143",
  appId: "1:431053297143:web:97397d3c969520e0018af2",
  measurementId: "G-7LMF62507T"
};

// Initialize Firebase
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const dbRef = firebase.database();
/* ============ STORAGE ============ */
const db={g:(k,d)=>JSON.parse(localStorage.getItem('lms_'+k))??d, s:(k,v)=>localStorage.setItem('lms_'+k,JSON.stringify(v))};
let users=db.g('users',[]),groups=db.g('groups',[]),customers=db.g('customers',[]),
    products=db.g('products',[]),loans=db.g('loans',[]),payments=db.g('payments',[]),
    settings=db.g('settings',{company:'My Company',address:'',phone:'',logo:''});
let cur=db.g('session',null);
const save=()=>{db.s('users',users);db.s('groups',groups);db.s('customers',customers);db.s('products',products);db.s('loans',loans);db.s('payments',payments);db.s('settings',settings)};
const uid=()=>Date.now()+''+Math.floor(Math.random()*999);
const fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const isAdmin=()=>cur&&cur.role==='Admin';
const normNic=s=>(s||'').toString().replace(/\s/g,'').toUpperCase();
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

(function(){let ch=false;customers.forEach((c,i)=>{if(!c.no){c.no='CUS'+String(i+1).padStart(4,'0');ch=true}if(!c.joined){c.joined=today();ch=true}});if(ch)save()})();
const nextCustNo=()=>{let mx=0;customers.forEach(c=>{const m=/^CUS(\d+)$/.exec(c.no||'');if(m)mx=Math.max(mx,+m[1])});return 'CUS'+String(mx+1).padStart(4,'0')};

/* ============ EXCEL ============ */
function exportXls(tableId,name){
  const t=document.getElementById(tableId);if(!t)return alert('Nothing to export');
  const clone=t.cloneNode(true);
  clone.querySelectorAll('button,select,input').forEach(e=>e.remove());
  const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1">${clone.innerHTML}</table></body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+today()+'.xls';a.click();
}
const xlsBtn=(id,name)=>`<button class="btn xl sm" onclick="exportXls('${id}','${name}')">📗 Excel</button>`;

/* ============ AUTH ============ */
function toggleAuth(s){document.getElementById('loginForm').classList.toggle('hidden',s);document.getElementById('signupForm').classList.toggle('hidden',!s)}
function signup(){
  function signup() {
  const nameInput = document.getElementById('suName');
  const userInput = document.getElementById('suUser');
  const passInput = document.getElementById('suPass');

  const n = nameInput ? nameInput.value.trim() : '';
  const u = userInput ? userInput.value.trim() : '';
  const p = passInput ? passInput.value : '';

  if (!n || !u || !p) {
    alert('කරුණාකර සියලුම විස්තර (Full Name, Username, Password) ඇතුළත් කරන්න.');
    return;
  }

  // Firebase Realtime Database එකේ Username එක කලින් තියෙනවද බලනවා
  dbRef.ref('users').orderByChild('username').equalTo(u).once('value', snapshot => {
    if (snapshot.exists()) {
      alert('මෙම Username එක දැනටමත් භාවිතයේ පවතී. වෙනත් එකක් ඇතුළත් කරන්න.');
    } else {
      // පළමු User ද නැද්ද කියා පරීක්ෂා කිරීම
      dbRef.ref('users').once('value', snap => {
        const isFirstUser = !snap.exists();
        const newUserId = Date.now().toString();

        const userData = {
          id: newUserId,
          name: n,
          username: u,
          password: p,
          role: isFirstUser ? 'Admin' : 'Officer',
          limit: isFirstUser ? 999999999 : 0
        };

        // Realtime Database එකට Save කිරීම ('users' node එකට)
        dbRef.ref('users/' + newUserId).set(userData)
          .then(() => {
            alert(isFirstUser ? 'Admin ගිණුම සාර්ථකව සෑදුවා! දැන් Login වන්න.' : 'ගිණුම සාර්ථකව සෑදුවා (Officer)! දැන් Login වන්න.');
            
            // Input Boxes Clear කිරීම
            nameInput.value = '';
            userInput.value = '';
            passInput.value = '';

            // Login Screen එකට මාරු කිරීම
            toggleAuth(0);
          })
          .catch(error => {
            alert('Error: ' + error.message);
          });
      });
    }
  });
}
function login(){
 function login() {
  const uVal = document.getElementById('liUser').value.trim();
  const pVal = document.getElementById('liPass').value;

  if (!uVal || !pVal) {
    alert('කරුණාකර Username සහ Password ඇතුළත් කරන්න.');
    return;
  }

  dbRef.ref('users').orderByChild('username').equalTo(uVal).once('value', snapshot => {
    if (snapshot.exists()) {
      let userData = null;
      snapshot.forEach(childSnap => {
        const user = childSnap.val();
        if (user.password === pVal) {
          userData = user;
        }
      });

      if (userData) {
        cur = userData;
        localStorage.setItem('lms_session', JSON.stringify(cur));
        boot();
      } else {
        alert('වැරදි Password එකක්!');
      }
    } else {
      alert('එවැනි Username එකක් සොයාගත නොහැක!');
    }
  });
}
</script>
</body>
</html>
