<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Management System</title>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--bg:#f1f5f9;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:#1e293b}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:100}
.loginBox{background:#fff;padding:32px;border-radius:16px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginBox h2{color:var(--p);margin-bottom:4px;text-align:center}
.loginBox p{text-align:center;color:#64748b;font-size:13px;margin-bottom:16px}
.loginBox img{display:block;margin:0 auto 10px;max-height:70px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--p);color:#fff;padding:16px 0;position:fixed;top:0;bottom:0;overflow-y:auto}
aside .brand{padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:10px;text-align:center}
aside .brand img{max-height:56px;max-width:100%;background:#fff;border-radius:8px;padding:4px}
aside .brand div{font-weight:700;margin-top:6px;font-size:15px}
aside button{display:block;width:100%;text-align:left;background:none;border:none;color:#dbeafe;padding:9px 18px;font-size:14px;cursor:pointer}
aside button:hover,aside button.active{background:rgba(255,255,255,.15);color:#fff;border-left:4px solid #93c5fd}
main{margin-left:230px;flex:1;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{font-size:20px;color:var(--p)}
.userchip{background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:12px;padding:16px}
.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;opacity:.85}
.stat.green{background:linear-gradient(135deg,#14532d,#16a34a)}
.stat.red{background:linear-gradient(135deg,#7f1d1d,#dc2626)}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin-bottom:10px}
input:focus,select:focus{outline:2px solid var(--p2)}
.btn{background:var(--p2);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--p)}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn.gray{background:#64748b}.btn.xl{background:#0d7a3f}.btn.orange{background:#d97706}.btn.sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#e2e8f0;padding:9px;text-align:left;color:#334155}
td{padding:8px 9px;border-bottom:1px solid #e2e8f0}
tr:hover td{background:#f8fafc}
.badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.b-pending{background:#fef3c7;color:#92400e}.b-active{background:#dbeafe;color:#1e40af}.b-settled{background:#dcfce7;color:#166534}.b-over{background:#fee2e2;color:#991b1b}
h3.sec{color:var(--p);margin-bottom:12px;font-size:16px}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <img id="loginLogo" src="" alt="" style="display:none;">
    <h2 id="loginCompany">Loan Management System</h2>
    <p>Sign in to continue</p>
    
    <!-- LOGIN FORM -->
    <div id="loginForm">
      <label>Username</label>
      <input type="text" id="liUser" placeholder="Enter username">
      <label>Password</label>
      <input type="password" id="liPass" placeholder="Enter password">
      <button type="button" class="btn" style="width:100%" onclick="login()">Login</button>
      <p style="margin-top:12px; text-align:center;">
        <a href="javascript:void(0)" onclick="toggleAuth(true)" style="color:#2563eb; font-size:13px;">Sign Up (new user)</a>
      </p>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="hidden">
      <label>Full Name</label>
      <input type="text" id="suName" placeholder="Enter full name">
      <label>Username</label>
      <input type="text" id="suUser" placeholder="Enter username">
      <label>Password</label>
      <input type="password" id="suPass" placeholder="Enter password">
      <button type="button" class="btn green" style="width:100%" onclick="signup()">Sign Up</button>
      <p style="margin-top:12px; text-align:center;">
        <a href="javascript:void(0)" onclick="toggleAuth(false)" style="color:#2563eb; font-size:13px;">Back to Login</a>
      </p>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand">
      <img id="sideLogo" src="" style="display:none;">
      <div id="sideCompany">My Company</div>
    </div>
    <button onclick="nav('dashboard',this)" class="active">📊 Dashboard</button>
    <button onclick="nav('customers',this)">👤 Customers</button>
    <button onclick="nav('loans',this)">💰 Loans</button>
    <button onclick="nav('payments',this)">🧾 Payments</button>
    <button onclick="logout()" style="color:#fecaca; margin-top:20px;">🚪 Logout</button>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="userchip" id="userChip"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
  /* ============ STORAGE HELPER ============ */
  const db = {
    g: (k, d) => {
      try {
        const val = localStorage.getItem('lms_' + k);
        return val ? JSON.parse(val) : d;
      } catch(e) {
        return d;
      }
    },
    s: (k, v) => localStorage.setItem('lms_' + k, JSON.stringify(v))
  };

  /* ============ GLOBAL VARIABLES ============ */
  let users = db.g('users', []);
  let customers = db.g('customers', []);
  let loans = db.g('loans', []);
  let payments = db.g('payments', []);
  let settings = db.g('settings', { company: 'My Company', logo: '' });
  let cur = db.g('session', null);

  const save = () => {
    db.s('users', users);
    db.s('customers', customers);
    db.s('loans', loans);
    db.s('payments', payments);
    db.s('settings', settings);
  };

  const uid = () => Date.now() + '' + Math.floor(Math.random() * 999);
  const fmt = n => 'Rs. ' + Number(n || 0).toLocaleString('en-LK', { minimumFractionDigits: 2 });

  /* ============ AUTHENTICATION LOGIC ============ */
  function toggleAuth(showSignup) {
    const lForm = document.getElementById('loginForm');
    const sForm = document.getElementById('signupForm');
    if (showSignup) {
      lForm.classList.add('hidden');
      sForm.classList.remove('hidden');
    } else {
      sForm.classList.add('hidden');
      lForm.classList.remove('hidden');
    }
  }

  function signup() {
    const nameEl = document.getElementById('suName');
    const userEl = document.getElementById('suUser');
    const passEl = document.getElementById('suPass');

    const n = nameEl.value.trim();
    const u = userEl.value.trim();
    const p = passEl.value;

    if (!n || !u || !p) {
      alert('කරුණාකර නම, Username සහ Password ඇතුළත් කරන්න.');
      return;
    }

    // Check if user already exists
    const exists = users.find(x => x.username.toLowerCase() === u.toLowerCase());
    if (exists) {
      alert('මෙම Username එක දැනටමත් පවතී. වෙනත් එකක් යොදන්න.');
      return;
    }

    const isFirstUser = users.length === 0;
    const newUser = {
      id: uid(),
      name: n,
      username: u,
      password: p,
      role: isFirstUser ? 'Admin' : 'Officer'
    };

    users.push(newUser);
    save();

    // Clear inputs
    nameEl.value = '';
    userEl.value = '';
    passEl.value = '';

    alert(isFirstUser ? 'Admin ගිණුම සාර්ථකව සෑදුවා! දැන් Login වන්න.' : 'Officer ගිණුම සාර්ථකව සෑදුවා! දැන් Login වන්න.');
    toggleAuth(false);
  }

  function login() {
    const uVal = document.getElementById('liUser').value.trim();
    const pVal = document.getElementById('liPass').value;

    const user = users.find(x => x.username.toLowerCase() === uVal.toLowerCase() && x.password === pVal);
    
    if (!user) {
      alert('වැරදි Username එකක් හෝ Password එකක්!');
      return;
    }

    cur = user;
    db.s('session', cur);
    boot();
  }

  function logout() {
    cur = null;
    db.s('session', null);
    location.reload();
  }

  /* ============ APP INITIALIZATION ============ */
  function boot() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('userChip').textContent = cur.name + ' (' + cur.role + ')';
    nav('dashboard', document.querySelector('aside button'));
  }

  /* ============ NAVIGATION & VIEWS ============ */
  function nav(page, btn) {
    document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.getElementById('pageTitle').textContent = page.toUpperCase();

    const content = document.getElementById('content');
    if (page === 'dashboard') content.innerHTML = renderDashboard();
    else if (page === 'customers') content.innerHTML = `<div class="card"><h3 class="sec">Customers View</h3></div>`;
    else if (page === 'loans') content.innerHTML = `<div class="card"><h3 class="sec">Loans View</h3></div>`;
    else if (page === 'payments') content.innerHTML = `<div class="card"><h3 class="sec">Payments View</h3></div>`;
  }

  function renderDashboard() {
    return `<div class="grid g4">
      <div class="stat"><div class="v">${customers.length}</div><div class="l">Total Customers</div></div>
      <div class="stat"><div class="v">${loans.length}</div><div class="l">Total Loans</div></div>
      <div class="stat green"><div class="v">${fmt(0)}</div><div class="l">Today's Collections</div></div>
    </div>`;
  }

  // Auto Boot if logged in
  if (cur) {
    boot();
  }
</script>
</body>
</html>
