<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Management System</title>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--bg:#f1f5f9;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:#1e293b}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:100}
.loginBox{background:#fff;padding:32px;border-radius:16px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginBox h2{color:var(--p);margin-bottom:4px;text-align:center}
.loginBox p{text-align:center;color:#64748b;font-size:13px;margin-bottom:16px}
.loginBox img{display:block;margin:0 auto 10px;max-height:70px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--p);color:#fff;padding:16px 0;position:fixed;top:0;bottom:0;overflow-y:auto}
aside .brand{padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:10px;text-align:center}
aside .brand img{max-height:56px;max-width:100%;background:#fff;border-radius:8px;padding:4px}
aside .brand div{font-weight:700;margin-top:6px;font-size:15px}
aside button{display:block;width:100%;text-align:left;background:none;border:none;color:#dbeafe;padding:9px 18px;font-size:14px;cursor:pointer}
aside button:hover,aside button.active{background:rgba(255,255,255,.15);color:#fff;border-left:4px solid #93c5fd}
main{margin-left:230px;flex:1;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{font-size:20px;color:var(--p)}
.userchip{background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:12px;padding:16px}
.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;opacity:.85}
.stat.green{background:linear-gradient(135deg,#14532d,#16a34a)}
.stat.red{background:linear-gradient(135deg,#7f1d1d,#dc2626)}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin-bottom:10px}
input:focus,select:focus{outline:2px solid var(--p2)}
.btn{background:var(--p2);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--p)}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn.gray{background:#64748b}.btn.xl{background:#0d7a3f}.btn.orange{background:#d97706}.btn.sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#e2e8f0;padding:9px;text-align:left;color:#334155}
td{padding:8px 9px;border-bottom:1px solid #e2e8f0}
tr:hover td{background:#f8fafc}
.badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.b-pending{background:#fef3c7;color:#92400e}.b-active{background:#dbeafe;color:#1e40af}.b-settled{background:#dcfce7;color:#166534}.b-over{background:#fee2e2;color:#991b1b}
h3.sec{color:var(--p);margin-bottom:12px;font-size:16px}
.secrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.secrow h3{color:var(--p);font-size:16px}
.cifItem{font-size:13px;padding:4px 0;border-bottom:1px dashed #e2e8f0}
.cifItem b{color:#475569;display:inline-block;min-width:130px}
.arrearsBox{background:#fee2e2;border:2px solid #dc2626;color:#991b1b;font-weight:700;padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:15px}
.pvBox{background:#eff6ff;border:2px solid #2563eb;border-radius:10px;padding:14px;margin-bottom:12px}
.pvBox .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #bfdbfe;font-size:14px}
.pvBox .row b.big{font-size:17px;color:#1e3a8a}
.syncStatus{font-size:11px;color:#6b7280;margin-top:4px}
.syncStatus.ok{color:var(--ok)}
.syncStatus.err{color:var(--bad)}
@media print{body *{visibility:hidden}#receiptArea,#receiptArea *{visibility:visible}#receiptArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <img id="loginLogo" src="" alt="" onerror="this.style.display='none'">
    <h2 id="loginCompany">Loan Management System</h2>
    <p>Sign in to continue</p>
    <div id="loginForm">
      <label>Username</label><input id="liUser">
      <label>Password</label><input id="liPass" type="password">
      <button class="btn" style="width:100%" onclick="login()">Login</button>
      <p style="margin-top:12px"><a href="#" onclick="toggleAuth(1)">Sign Up (new user)</a></p>
    </div>
    <div id="signupForm" class="hidden">
      <label>Full Name</label><input id="suName">
      <label>Username</label><input id="suUser">
      <label>Password</label><input id="suPass" type="password">
      <button class="btn green" style="width:100%" onclick="signup()">Sign Up</button>
      <p style="margin-top:12px"><a href="#" onclick="toggleAuth(0)">Back to Login</a></p>
    </div>
    <div id="syncStatus" class="syncStatus"></div>
  </div>
</div>

<div id="app" class="hidden">
<aside>
  <div class="brand"><img id="sideLogo" src="" onerror="this.style.display='none'"><div id="sideCompany">My Company</div></div>
  <button onclick="nav('dashboard',this)" class="active">📊 Dashboard</button>
  <button onclick="nav('cif',this)">🔎 CIF</button>
  <button onclick="nav('customers',this)">👤 Customers</button>
  <button onclick="nav('groups',this)">👥 Groups</button>
  <button onclick="nav('products',this)">📦 Loan Products</button>
  <button onclick="nav('loans',this)">💰 Loans</button>
  <button onclick="nav('payments',this)">🧾 Payments</button>
  <button onclick="nav('duetoday',this)">📅 Due / Week Day</button>
  <button onclick="nav('ledger',this)">📒 Ledger</button>
  <button onclick="nav('collection',this)">📈 Collection Report</button>
  <button onclick="nav('monthly',this)">📆 Monthly Report</button>
  <button onclick="nav('profit',this)">💹 Profit Report</button>
  <button onclick="nav('officer',this)">🎯 Officer Targets</button>
  <button onclick="nav('users',this)">🔐 Users</button>
  <button onclick="nav('settings',this)">⚙️ Settings</button>
  <button onclick="logout()" style="color:#fecaca">🚪 Logout</button>
</aside>
<main>
  <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="userchip" id="userChip"></div></div>
  <div id="content"></div>
</main>
</div>

<div id="receiptArea"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

<script>
/* ============ FIREBASE CONFIG ============ */
// IMPORTANT: Move this to environment variables in production!
const firebaseConfig = {
  apiKey: "AIzaSyBpTYBgYJ05aHew-OpPyKj0cN8NwDZGczs",
  authDomain: "fwinn-ca9da.firebaseapp.com",
  databaseURL: "https://fwinn-ca9da-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fwinn-ca9da",
  storageBucket: "fwinn-ca9da.firebasestorage.app",
  messagingSenderId: "907008990874",
  appId: "1:907008990874:web:6e2dccdb6c76dd0a4f4923",
  measurementId: "G-PSVBJRVT7B"
};

// Initialize Firebase
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
let syncStatus = document.getElementById('syncStatus');

// Fallback storage for offline functionality
const localStorage_fallback = {
  g: (k, d) => JSON.parse(localStorage.getItem('lms_' + k)) ?? d,
  s: (k, v) => localStorage.setItem('lms_' + k, JSON.stringify(v))
};

/* ============ GLOBAL DATA ============ */
let users = [], groups = [], customers = [], products = [], loans = [], payments = [];
let settings = { company: 'My Company', address: '', phone: '', logo: '' };
let cur = null;
let isOnline = true;
let syncInProgress = false;

/* ============ SYNC FUNCTIONS ============ */
async function syncToFirebase() {
  if (syncInProgress || !cur) return;
  syncInProgress = true;
  
  try {
    const userDataPath = `users/${cur.id}/data`;
    await db.ref(userDataPath).update({
      users, groups, customers, products, loans, payments, settings,
      lastSync: new Date().toISOString()
    });
    updateSyncStatus('✅ Synced', true);
  } catch (err) {
    console.error('Sync error:', err);
    updateSyncStatus('⚠️ Offline mode', false);
  } finally {
    syncInProgress = false;
  }
}

async function loadFromFirebase() {
  if (!cur) return;
  
  try {
    const snapshot = await db.ref(`users/${cur.id}/data`).get();
    if (snapshot.exists()) {
      const data = snapshot.val();
      users = data.users || [];
      groups = data.groups || [];
      customers = data.customers || [];
      products = data.products || [];
      loans = data.loans || [];
      payments = data.payments || [];
      settings = data.settings || settings;
      updateSyncStatus('✅ Loaded from Firebase', true);
    }
  } catch (err) {
    console.error('Load error:', err);
    loadFromLocalStorage();
  }
}

function loadFromLocalStorage() {
  users = localStorage_fallback.g('users', []);
  groups = localStorage_fallback.g('groups', []);
  customers = localStorage_fallback.g('customers', []);
  products = localStorage_fallback.g('products', []);
  loans = localStorage_fallback.g('loans', []);
  payments = localStorage_fallback.g('payments', []);
  settings = localStorage_fallback.g('settings', settings);
}

function saveLocally() {
  localStorage_fallback.s('users', users);
  localStorage_fallback.s('groups', groups);
  localStorage_fallback.s('customers', customers);
  localStorage_fallback.s('products', products);
  localStorage_fallback.s('loans', loans);
  localStorage_fallback.s('payments', payments);
  localStorage_fallback.s('settings', settings);
}

const save = async () => {
  saveLocally();
  if (isOnline) {
    setTimeout(syncToFirebase, 500);
  }
};

function updateSyncStatus(msg, isGood) {
  if (syncStatus) {
    syncStatus.textContent = msg;
    syncStatus.className = 'syncStatus ' + (isGood ? 'ok' : 'err');
  }
}

/* ============ NETWORK STATUS ============ */
window.addEventListener('online', () => {
  isOnline = true;
  updateSyncStatus('🔄 Going online...', true);
  if (cur) syncToFirebase();
});

window.addEventListener('offline', () => {
  isOnline = false;
  updateSyncStatus('📴 Offline - Changes saved locally', false);
});

/* ============ UTILITY FUNCTIONS ============ */
const uid = () => Date.now() + '' + Math.floor(Math.random() * 999);
const fmt = n => 'Rs. ' + Number(n || 0).toLocaleString('en-LK', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => new Date().toISOString().split('T')[0];
const esc = s => (s + '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const normNic = n => (n + '').replace(/[^0-9vV]/g, '').toUpperCase();

/* ============ AUTH ============ */
async function login() {
  const uname = document.getElementById('liUser').value.trim();
  const pass = document.getElementById('liPass').value.trim();
  
  if (!uname || !pass) return alert('Enter username & password');
  
  try {
    // For demo: check against users array (in production, use Firebase Auth)
    const user = users.find(u => u.username === uname && u.password === pass);
    if (!user) return alert('❌ Invalid credentials');
    
    cur = user;
    localStorage_fallback.s('session', cur);
    await loadFromFirebase();
    boot();
  } catch (err) {
    alert('❌ ' + err.message);
  }
}

async function signup() {
  const name = document.getElementById('suName').value.trim();
  const uname = document.getElementById('suUser').value.trim();
  const pass = document.getElementById('suPass').value.trim();
  
  if (!name || !uname || !pass) return alert('All fields required');
  if (users.find(u => u.username === uname)) return alert('❌ Username taken');
  
  const newUser = {
    id: uid(),
    name,
    username: uname,
    password: pass,
    role: 'user',
    created: today()
  };
  
  users.push(newUser);
  await save();
  alert('✅ Account created! Now login.');
  toggleAuth(0);
}

function toggleAuth(mode) {
  document.getElementById('loginForm').classList.toggle('hidden', mode === 1);
  document.getElementById('signupForm').classList.toggle('hidden', mode === 0);
}

async function logout() {
  cur = null;
  localStorage_fallback.s('session', null);
  location.reload();
}

function isAdmin() {
  return cur && cur.role === 'admin';
}

function adminPassOK() {
  const p = prompt('Admin Password:');
  const admin = users.find(u => u.role === 'admin');
  return admin && admin.password === p;
}

/* ============ UI ============ */
function boot() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyBrand();
  nav('dashboard', document.querySelector('aside button:first-of-type'));
  updateUserChip();
}

function applyBrand() {
  document.getElementById('loginCompany').textContent = settings.company;
  document.getElementById('sideCompany').textContent = settings.company;
  if (settings.logo) {
    document.getElementById('loginLogo').src = settings.logo;
    document.getElementById('sideLogo').src = settings.logo;
  }
}

function updateUserChip() {
  if (cur) {
    document.getElementById('userChip').textContent = cur.name + ' (' + cur.role + ')';
  }
}

function nav(page, btn) {
  document.querySelectorAll('aside button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  let html = '';
  document.getElementById('pageTitle').textContent = btn.textContent.trim();
  
  switch (page) {
    case 'dashboard': html = pgDashboard(); break;
    case 'customers': html = pgCustomers(); break;
    case 'groups': html = pgGroups(); break;
    case 'products': html = pgProducts(); break;
    case 'loans': html = pgLoans(); break;
    case 'payments': html = pgPayments(); break;
    case 'users': html = pgUsers(); break;
    case 'settings': html = pgSettings(); break;
    default: html = '<div class="card"><p>Page not found</p></div>';
  }
  
  document.getElementById('content').innerHTML = html;
}

/* ============ PAGES ============ */
function pgDashboard() {
  const activeLoans = loans.filter(l => l.status === 'active').length;
  const totalLoaned = loans.filter(l => l.status !== 'settled').reduce((a, b) => a + (b.amount || 0), 0);
  const totalPayments = payments.reduce((a, b) => a + (b.amount || 0), 0);
  
  return `
    <div class="grid g4">
      <div class="stat"><div class="v">${customers.length}</div><div class="l">Total Customers</div></div>
      <div class="stat"><div class="v">${activeLoans}</div><div class="l">Active Loans</div></div>
      <div class="stat green"><div class="v">${fmt(totalPayments)}</div><div class="l">Total Payments</div></div>
      <div class="stat red"><div class="v">${fmt(totalLoaned)}</div><div class="l">Outstanding</div></div>
    </div>
    <div class="card">
      <h3 class="sec">Recent Activity</h3>
      <p>Dashboard data syncing with Firebase Realtime Database.</p>
    </div>
  `;
}

function pgCustomers() {
  return `
    <div class="card">
      <h3 class="sec">Customers (${customers.length})</h3>
      <table>
        <tr><th>Cust No</th><th>Name</th><th>Phone</th><th>Loans</th></tr>
        ${customers.map(c => `
          <tr>
            <td>${esc(c.no)}</td>
            <td>${esc(c.title)}. ${esc(c.full)}</td>
            <td>${esc(c.phone)}</td>
            <td>${loans.filter(l => l.customerId === c.id).length}</td>
          </tr>
        `).join('') || '<tr><td colspan="4">No customers</td></tr>'}
      </table>
    </div>
  `;
}

function pgGroups() {
  return `
    <div class="card">
      <h3 class="sec">Groups (${groups.length})</h3>
      <p>Groups list will be displayed here.</p>
    </div>
  `;
}

function pgProducts() {
  return `
    <div class="card">
      <h3 class="sec">Loan Products (${products.length})</h3>
      <p>Loan products list will be displayed here.</p>
    </div>
  `;
}

function pgLoans() {
  return `
    <div class="card">
      <h3 class="sec">Loans (${loans.length})</h3>
      <p>Loans list will be displayed here.</p>
    </div>
  `;
}

function pgPayments() {
  return `
    <div class="card">
      <h3 class="sec">Payments (${payments.length})</h3>
      <p>Payments list will be displayed here.</p>
    </div>
  `;
}

function pgUsers() {
  return `
    <div class="card">
      <h3 class="sec">Users (${users.length})</h3>
      <table>
        <tr><th>Name</th><th>Username</th><th>Role</th><th>Created</th></tr>
        ${users.map(u => `
          <tr>
            <td>${esc(u.name)}</td>
            <td>${esc(u.username)}</td>
            <td><span class="badge">${u.role}</span></td>
            <td>${u.created}</td>
          </tr>
        `).join('')}
      </table>
    </div>
  `;
}

function pgSettings() {
  return `
    <div class="card">
      <h3 class="sec">Settings</h3>
      <label>Company Name</label>
      <input id="setCo" value="${esc(settings.company)}">
      <label>Address</label>
      <input id="setAddr" value="${esc(settings.address)}">
      <label>Phone</label>
      <input id="setPh" value="${esc(settings.phone)}">
      <button class="btn green" onclick="saveSettings()">💾 Save Settings</button>
    </div>
  `;
}

async function saveSettings() {
  settings.company = document.getElementById('setCo').value;
  settings.address = document.getElementById('setAddr').value;
  settings.phone = document.getElementById('setPh').value;
  await save();
  applyBrand();
  alert('✅ Settings saved!');
}

/* ============ INIT ============ */
isOnline = navigator.onLine;
cur = localStorage_fallback.g('session', null);

if (cur && users.length === 0) {
  loadFromLocalStorage();
}

if (cur && users.find(u => u.id === cur.id)) {
  loadFromFirebase().then(() => boot());
} else {
  updateSyncStatus('Ready', true);
}
</script>
</body>
</html>
