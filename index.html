<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Management System</title>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--bg:#f1f5f9;--card:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:#1e293b}
.hidden{display:none!important}
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:100}
.loginBox{background:#fff;padding:32px;border-radius:16px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.loginBox h2{color:var(--p);margin-bottom:4px;text-align:center}
.loginBox p{text-align:center;color:#64748b;font-size:13px;margin-bottom:16px}
.loginBox img{display:block;margin:0 auto 10px;max-height:70px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--p);color:#fff;padding:16px 0;position:fixed;top:0;bottom:0;overflow-y:auto}
aside .brand{padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.2);margin-bottom:10px;text-align:center}
aside .brand img{max-height:56px;max-width:100%;background:#fff;border-radius:8px;padding:4px}
aside .brand div{font-weight:700;margin-top:6px;font-size:15px}
aside button{display:block;width:100%;text-align:left;background:none;border:none;color:#dbeafe;padding:9px 18px;font-size:14px;cursor:pointer}
aside button:hover,aside button.active{background:rgba(255,255,255,.15);color:#fff;border-left:4px solid #93c5fd}
main{margin-left:230px;flex:1;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{font-size:20px;color:var(--p)}
.userchip{background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:12px;padding:16px}
.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12px;opacity:.85}
.stat.green{background:linear-gradient(135deg,#14532d,#16a34a)}
.stat.red{background:linear-gradient(135deg,#7f1d1d,#dc2626)}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin-bottom:10px}
input:focus,select:focus{outline:2px solid var(--p2)}
.btn{background:var(--p2);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{background:var(--p)}
.btn.green{background:var(--ok)}.btn.red{background:var(--bad)}.btn.gray{background:#64748b}.btn.xl{background:#0d7a3f}.btn.orange{background:#d97706}.btn.sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#e2e8f0;padding:9px;text-align:left;color:#334155}
td{padding:8px 9px;border-bottom:1px solid #e2e8f0}
tr:hover td{background:#f8fafc}
.badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.b-pending{background:#fef3c7;color:#92400e}.b-active{background:#dbeafe;color:#1e40af}.b-settled{background:#dcfce7;color:#166534}.b-over{background:#fee2e2;color:#991b1b}
h3.sec{color:var(--p);margin-bottom:12px;font-size:16px}
.secrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.secrow h3{color:var(--p);font-size:16px}
.cifItem{font-size:13px;padding:4px 0;border-bottom:1px dashed #e2e8f0}
.cifItem b{color:#475569;display:inline-block;min-width:130px}
.arrearsBox{background:#fee2e2;border:2px solid #dc2626;color:#991b1b;font-weight:700;padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:15px}
.pvBox{background:#eff6ff;border:2px solid #2563eb;border-radius:10px;padding:14px;margin-bottom:12px}
.pvBox .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #bfdbfe;font-size:14px}
.pvBox .row b.big{font-size:17px;color:#1e3a8a}
@media print{body *{visibility:hidden}#receiptArea,#receiptArea *{visibility:visible}#receiptArea{position:absolute;left:0;top:0;width:100%}}
</style>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <img id="loginLogo" src="" alt="" onerror="this.style.display='none'">
    <h2 id="loginCompany">Loan Management System</h2>
    <p>Sign in to continue</p>
    <div id="loginForm">
      <label>Username (Email)</label><input id="liUser">
      <label>Password</label><input id="liPass" type="password">
      <button class="btn" style="width:100%" onclick="login()">Login</button>
      <p style="margin-top:12px"><a href="#" onclick="toggleAuth(1)">Sign Up (new user)</a></p>
    </div>
    <div id="signupForm" class="hidden">
      <label>Full Name</label><input id="suName">
      <label>Username (Email)</label><input id="suUser">
      <label>Password</label><input id="suPass" type="password">
      <button class="btn green" style="width:100%" onclick="signup()">Sign Up</button>
      <p style="margin-top:12px"><a href="#" onclick="toggleAuth(0)">Back to Login</a></p>
    </div>
  </div>
</div>

<div id="app" class="hidden">
<aside>
  <div class="brand"><img id="sideLogo" src="" onerror="this.style.display='none'"><div id="sideCompany">My Company</div></div>
  <button onclick="nav('dashboard',this)" class="active">📊 Dashboard</button>
  <button onclick="nav('cif',this)">🔎 CIF</button>
  <button onclick="nav('customers',this)">👤 Customers</button>
  <button onclick="nav('groups',this)">👥 Groups</button>
  <button onclick="nav('products',this)">📦 Loan Products</button>
  <button onclick="nav('loans',this)">💰 Loans</button>
  <button onclick="nav('payments',this)">🧾 Payments</button>
  <button onclick="nav('duetoday',this)">📅 Due / Week Day</button>
  <button onclick="nav('ledger',this)">📒 Ledger</button>
  <button onclick="nav('collection',this)">📈 Collection Report</button>
  <button onclick="nav('monthly',this)">📆 Monthly Report</button>
  <button onclick="nav('profit',this)">💹 Profit Report</button>
  <button onclick="nav('officer',this)">🎯 Officer Targets</button>
  <button onclick="nav('users',this)">🔐 Users</button>
  <button onclick="nav('settings',this)">⚙️ Settings</button>
  <button onclick="logout()" style="color:#fecaca">🚪 Logout</button>
</aside>
<main>
  <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="userchip" id="userChip"></div></div>
  <div id="content"></div>
</main>
</div>

<div id="receiptArea"></div>

<script>
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBpTYBgYJ05aHew-OpPyKj0cN8NwDZGczs",
  authDomain: "fwinn-ca9da.firebaseapp.com",
  databaseURL: "https://fwinn-ca9da-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fwinn-ca9da",
  storageBucket: "fwinn-ca9da.firebasestorage.app",
  messagingSenderId: "907008990874",
  appId: "1:907008990874:web:6e2dccdb6c76dd0a4f4923",
  measurementId: "G-PSVBJRVT7B"
};

/* ============ STORAGE ============ */
// Initialize Firebase
firebase.initializeApp(firebaseConfig);

// Firebase Database References
const usersDbRef = firebase.database().ref('users'); // Reference to '/users' node (for authentication data)
const appDataRef = firebase.database().ref('appData'); // Central node for all application data (groups, customers, etc.)

// Application data variables - these will be populated from Firebase
let users = []; // Already managed by Firebase
let groups = [];
let customers = [];
let products = [];
let loans = [];
let payments = [];
let settings = {company:'Loan Management System',address:'',phone:'',logo:''}; // Set a clear default for initial load

let cur = null; // Current user, populated by Firebase auth listener

// This uid function now generates Firebase-compatible unique IDs
const uid = () => appDataRef.push().key;

const fmt=n=>'Rs. '+Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>(s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const isAdmin=()=>cur && cur.role === 'Admin';
const normNic=s=>(s||'').toString().replace(/\s/g,'').toUpperCase();
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Helper to generate next customer number - this will be run AFTER customers are loaded from Firebase
const nextCustNo=()=>{
  let mx=0;
  customers.forEach(c=>{
    const m=/^CUS(\d+)$/.exec(c.no||'');
    if(m)mx=Math.max(mx,+m[1]);
  });
  return 'CUS'+String(mx+1).padStart(4,'0');
};

/* ============ EXCEL ============ */
function exportXls(tableId,name){
  const t=document.getElementById(tableId);if(!t)return alert('Nothing to export');
  const clone=t.cloneNode(true);
  clone.querySelectorAll('button,select,input').forEach(e=>e.remove());
  const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><table border="1">${clone.innerHTML}</table></body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'-'+today()+'.xls';a.click();
}
const xlsBtn=(id,name)=>`<button class="btn xl sm" onclick="exportXls('${id}','${name}')">📗 Excel</button>`;

/* ============ AUTH (Firebase) ============ */
// Function to sync users from Firebase Realtime Database
async function syncUsersFromFirebase() {
  try {
    const snapshot = await usersDbRef.once('value');
    const firebaseUsers = snapshot.val();
    users = []; // Clear existing local users
    if (firebaseUsers) {
      for (const uid in firebaseUsers) {
        if (firebaseUsers.hasOwnProperty(uid)) {
          users.push({ ...firebaseUsers[uid], id: uid }); // Use uid as id
        }
      }
    }
  } catch (error) {
    console.error("Error syncing users from Firebase:", error);
    alert("Failed to load user data from server. Please refresh.");
  }
}

// This function now just handles toggling the login/signup form visibility
function toggleAuth(s){document.getElementById('loginForm').classList.toggle('hidden',s);document.getElementById('signupForm').classList.toggle('hidden',!s)}

async function signup(){
  const n=suName.value.trim(); // Full Name
  const u=suUser.value.trim(); // Username (Email)
  const p=suPass.value;        // Password
  if(!n||!u||!p)return alert('Fill all fields');

  try {
    const userCredential = await firebase.auth().createUserWithEmailAndPassword(u, p);
    const user = userCredential.user;
    await user.updateProfile({ displayName: n }); // Set display name in Firebase Auth

    // Check if this is the very first user being created in the system
    // Get current user count
    const allUsersSnap = await usersDbRef.once('value');
    const firstUser = allUsersSnap.numChildren() === 0;

    const role = firstUser ? 'Admin' : 'Officer';
    const limit = firstUser ? 999999999 : 0;
    const status = firstUser ? 'approved' : 'pending'; // New: status is 'pending' for non-first users

    // Store additional user details in Firebase Realtime Database
    await usersDbRef.child(user.uid).set({
      name: n,
      username: u, // Storing email as username for consistency with login input
      role: role,
      limit: limit,
      status: status // Save the status
    });
    
    await syncUsersFromFirebase(); // Refresh local users array
    alert(firstUser ? 'Admin account created! Please login.' : 'Account created. Please wait for Admin approval.'); // Update alert message
    toggleAuth(0); // Switch back to login form
  } catch (error) {
    alert('Signup Error: ' + error.message);
  }
}

async function login(){
  const username = liUser.value.trim(); // This is the email for Firebase Auth
  const password = liPass.value;

  try {
    // Firebase will handle authentication and populate the onAuthStateChanged listener
    await firebase.auth().signInWithEmailAndPassword(username, password);
    // onAuthStateChanged listener will handle the rest (fetching user profile, booting app)
  } catch (error) {
    alert('Login Error: ' + error.message);
  }
}

async function logout(){
  try {
    await firebase.auth().signOut();
    liUser.value = ''; // Clear username field
    liPass.value = ''; // Clear password field
    // onAuthStateChanged listener will handle redirecting to login screen and applying brand
  } catch (error) {
    alert('Logout Error: ' + error.message);
  }
}

// Function to load all application data (groups, customers, etc.) from Firebase
async function loadAllAppDataFromFirebase() {
  try {
    const snapshot = await appDataRef.once('value');
    const data = snapshot.val();

    // Populate global arrays with data from Firebase
    groups = data?.groups ? Object.values(data.groups) : [];
    customers = data?.customers ? Object.values(data.customers) : [];
    products = data?.products ? Object.values(data.products) : [];
    loans = data?.loans ? Object.values(data.loans) : [];
    payments = data?.payments ? Object.values(data.payments) : [];
    
    // IMPORTANT: settings should be treated as an object, not an array of objects
    // Fallback to default if no settings found in Firebase
    settings = data?.settings || {company:'Loan Management System',address:'',phone:'',logo:''}; 
    
    console.log("Settings loaded from Firebase:", settings);

    // Ensure customer numbers and join dates are set for any legacy local storage customers
    // This part ensures data consistency after loading from Firebase
    let customersChanged = false;
    customers.forEach((c) => {
        if (!c.no || !c.no.startsWith('CUS')) {
            c.no = nextCustNo(); // Assign a new 'CUS' number if missing
            customersChanged = true;
        }
        if (!c.joined) {
            c.joined = today(); // Assign today's date if missing
            customersChanged = true;
        }
    });

    if (customersChanged) {
        // If any customer data was modified, save it back to Firebase
        const customersObject = customers.reduce((obj, c) => ({ ...obj, [c.id]: c }), {});
        await appDataRef.child('customers').set(customersObject);
    }

  } catch (error) {
    console.error("Error loading application data from Firebase:", error);
    // If a user logs in and there's no initial data, this might show an error.
    // For a new system, it's normal for data to be empty.
    // Consider if this alert should always show or only for certain types of errors.
    // alert("Failed to load application data from server. Please refresh.");
  }
}

// Renamed boot() to bootApp() to avoid confusion with the initial auth state check
async function bootApp(){
  loginScreen.classList.add('hidden');
  app.classList.remove('hidden');
  userChip.textContent=cur.name+' ('+cur.role+')';
  
  await loadAllAppDataFromFirebase(); // Ensure settings are loaded
  applyBrand(); // Apply the freshly loaded settings to the UI
  console.log("App booted with settings:", settings);
  nav('dashboard',document.querySelector('aside button'));
}

function applyBrand(){
  // console.log("Applying brand with settings:", settings); // Debugging
  sideCompany.textContent=settings.company;
  loginCompany.textContent=settings.company;
  sideLogo.src=settings.logo||'';
  loginLogo.src=settings.logo||'';
  sideLogo.style.display=settings.logo?'':'none';
  loginLogo.style.display=settings.logo?'':'none';
}

// Simplified adminPassOK for client-side only. For actual security, re-authentication or server-side checks are needed.
function adminPassOK(){
  if (cur && cur.role === 'Admin') {
    const p = prompt('🔐 Confirm YOUR Admin password: (enter anything to confirm)'); // For demonstration, just needs non-null input
    return p !== null; // True if user enters something, false if they click cancel
  }
  alert('❌ You must be an Admin to perform this action.');
  return false;
}

// Firebase Auth State Listener
firebase.auth().onAuthStateChanged(async (user) => {
  if (user) {
    // User is signed in. Fetch their full profile from Realtime DB.
    try {
      const dbUserSnap = await usersDbRef.child(user.uid).once('value');
      const dbUser = dbUserSnap.val();

      if (dbUser) {
        if (dbUser.status === 'pending') { // Check for pending status
          await firebase.auth().signOut();
          alert("Your account is pending approval from an Admin. Please wait.");
          loginScreen.classList.remove('hidden');
          app.classList.add('hidden');
          return; // Stop execution here
        }

        cur = { ...dbUser, uid: user.uid, email: user.email };
        await syncUsersFromFirebase();
        bootApp();
      } else {
        // User exists in Auth but not in DB - log them out
        await firebase.auth().signOut();
        console.error("User profile missing in Realtime DB for UID:", user.uid);
        alert("Your user profile is incomplete. Please contact support.");
        loginScreen.classList.remove('hidden');
        app.classList.add('hidden');
      }
    } catch (error) {
      console.error("Error fetching user profile from Firebase DB:", error);
      alert("Failed to load user profile. Please try again.");
      await firebase.auth().signOut(); // Force sign out on error
      loginScreen.classList.remove('hidden');
      app.classList.add('hidden');
    }
  } else {
    // No user is signed in. Show login screen.
    cur = null;
    loginScreen.classList.remove('hidden');
    app.classList.add('hidden');
    
    // On logout or initial load without login, ensure latest settings are displayed
    try {
        const settingsSnapshot = await appDataRef.child('settings').once('value');
        settings = settingsSnapshot.val() || {company:'Loan Management System',address:'',phone:'',logo:''};
    } catch (error) {
        console.warn("Could not load settings for login screen:", error);
        settings = {company:'Loan Management System',address:'',phone:'',logo:''}; // Fallback to default
    }
    applyBrand(); // Apply fetched/default brand to login screen
  }
});

/* ============ NAV ============ */
function nav(page,btn){
  document.querySelectorAll('aside button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  pageTitle.textContent=btn?btn.textContent.slice(2):page;
  const R={dashboard,cif:pgCIF,customers:pgCustomers,groups:pgGroups,products:pgProducts,loans:pgLoans,payments:pgPayments,duetoday:pgDue,ledger:pgLedger,collection:pgCollection,monthly:pgMonthly,profit:pgProfit,officer:pgOfficer,users:pgUsers,settings:pgSettings};
  content.innerHTML=R[page]();
}
const navBtn=t=>[...document.querySelectorAll('aside button')].find(b=>b.textContent.includes(t));

/* ============ DASHBOARD ============ */
function dashboard(){
  const act=loans.filter(l=>l.status==='active');
  const out=act.reduce((s,l)=>s+(l.totalPayable-l.paid),0);
  const col=payments.filter(p=>p.date===today()).reduce((s,p)=>s+p.amount,0);
  const totArr=act.reduce((s,l)=>s+arrearsOf(l),0);
  return `<div class="grid g4">
    <div class="stat"><div class="v">${customers.length}</div><div class="l">Customers</div></div>
    <div class="stat"><div class="v">${fmt(out)}</div><div class="l">Total Outstanding (${act.length} loans)</div></div>
    <div class="stat red"><div class="v">${fmt(totArr)}</div><div class="l">⚠️ Total Arrears</div></div>
    <div class="stat green"><div class="v">${fmt(col)}</div><div class="l">Today's Collection</div></div>
  </div>
  <div class="card" style="margin-top:18px"><h3 class="sec">Pending Loan Approvals</h3>${loanTable(loans.filter(l=>l.status==='pending'),'tblPend')}</div>`;
}
function arrearsOf(l){
  let cumDue=0;const t=today();
  l.schedule.forEach(r=>{if(r.date<=t)cumDue+=r.total});
  return Math.max(0,cumDue-l.paid);
}

/* ============ CIF + DOCUMENTS ============ */
function pgCIF(){
  return `<div class="card"><h3 class="sec">CIF - Customer Information Search</h3>
    <div class="grid g3"><div style="grid-column:span 2"><label>Search by NIC / Phone / Name / Customer No</label>
    <input id="cifQ" placeholder="Type NIC, phone, name or CUS number..." oninput="cifSearch()"></div>
    <div style="align-self:end"><button class="btn" onclick="cifSearch()">🔎 Search</button></div></div>
    <div id="cifResults"></div></div>
  <div id="cifProfile"></div>
  <div class="card"><h3 class="sec">📋 All Customers Report (by Join Date)</h3>
    <div class="grid g3">
      <div><label>Joined From</label><input id="cifFrom" type="date"></div>
      <div><label>Joined To</label><input id="cifTo" type="date" value="${today()}"></div>
      <div style="align-self:end"><button class="btn" onclick="cifAllReport()">Generate</button></div>
    </div><div id="cifAllOut"></div></div>`;
}
function cifSearch(){
  const q=cifQ.value.trim().toLowerCase();const qn=normNic(q);
  if(!q){cifResults.innerHTML='';return}
  const hits=customers.filter(c=>
    normNic(c.nic).includes(qn)||(c.no||'').toLowerCase().includes(q)||
    (c.phone||'').replace(/\s/g,'').includes(q.replace(/\s/g,''))||
    (c.full||'').toLowerCase().includes(q)||(c.other||'').toLowerCase().includes(q));
  cifResults.innerHTML=`<table id="tblCif"><tr><th>Cust No</th><th>Name</th><th>NIC</th><th>Phone</th><th>Joined</th><th>Active Loans</th><th></th></tr>
  ${hits.map(c=>{const ln=loans.filter(l=>l.customerId===c.id&&l.status!=='settled').length;
  return `<tr><td><b>${esc(c.no)}</b></td><td><b>${esc(c.title)}. ${esc(c.full)}</b></td><td>${esc(c.nic)}</td><td>${esc(c.phone)}</td><td>${esc(c.joined)}</td>
  <td>${ln?`<span class="badge b-active">${ln}</span>`:'<span class="badge b-settled">0</span>'}</td>
  <td><button class="btn sm" onclick="viewCIF('${c.id}')">👁️ View CIF</button></td></tr>`}).join('')||'<tr><td colspan=7>❌ No customer found</td></tr>'}</table>`;
}
function cifAllReport(){
  const f=cifFrom.value||'0000-01-01',t=cifTo.value||'9999-12-31';
  const list=customers.filter(c=>(c.joined||'')>=f&&(c.joined||'')<=t).sort((a,b)=>(a.joined||'').localeCompare(b.joined||''));
  cifAllOut.innerHTML=`<div style="text-align:right;margin:8px 0">${xlsBtn('tblCifAll','all-customers')}</div>
  <table id="tblCifAll"><tr><th>Cust No</th><th>Join Date</th><th>Name</th><th>NIC</th><th>Phone</th><th>Group</th><th>Address</th><th>Active Loans</th><th>Outstanding</th></tr>
  ${list.map(c=>{const g=groups.find(x=>x.id===c.group);
    const cl=loans.filter(l=>l.customerId===c.id&&l.status==='active');
    const out=cl.reduce((s,l)=>s+(l.totalPayable-l.paid),0);

async function upDoc(cid,inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>800*1024)return alert('❌ File too big! Max 800KB.');
  const r=new FileReader();
  r.onload=async e=>{ // Made async to await Firebase calls
    const c=customers.find(x=>x.id===cid);if(!c)return;
    c.docs=c.docs||[];
    const newDocId = uid(); // Generate a unique ID for the document
    c.docs.push({id:newDocId, name:f.name,type:f.type,data:e.target.result,date:today(),by:cur.name});
    
    try{
        await appDataRef.child('customers').child(cid).update({ docs: c.docs });
        await loadAllAppDataFromFirebase(); // Reload data after update
        alert('✅ Document uploaded!');
        viewCIF(cid);
    }catch(err){
        console.error("Error uploading document to Firebase:", err);
        c.docs.pop(); // Remove from local if Firebase save failed
        alert('❌ Failed to upload document. Possible storage issue or database rule violation.');
    }
  };
  r.readAsDataURL(f);
}
function openDoc(cid,did){
  const c=customers.find(x=>x.id===cid);const d=c&&(c.docs||[]).find(x=>x.id===did);if(!d)return;
  const w=window.open('','_blank');
  w.document.write('<title>'+esc(d.name)+'</title>'+((d.type||'').startsWith('image')
    ?'<img src="'+d.data+'" style="max-width:100%">'
    :'<iframe src="'+d.data+'" style="width:100%;height:98vh;border:none"></iframe>'));
}
async function delDoc(cid,did){
  if(!isAdmin())return alert('❌ Only Admin can delete documents');
  if(!confirm('Delete this document?'))return;
  const c=customers.find(x=>x.id===cid);if(!c)return;
  c.docs=(c.docs||[]).filter(x=>x.id!==did);
  try {
    await appDataRef.child('customers').child(cid).update({ docs: c.docs });
    await loadAllAppDataFromFirebase(); // Reload data after update
    viewCIF(cid);
  } catch (error) {
    console.error("Error deleting document from Firebase:", error);
    alert("Failed to delete document: " + error.message);
  }
}

/* Save - create OR update */
async function addCustomer(){
  if(!cFull.value.trim()||!cNic.value.trim()||!cPhone.value.trim())return alert('Full name, NIC & Phone are required');
  const dup=customers.find(c=>normNic(c.nic)===normNic(cNic.value)&&c.id!==editCid);
  if(dup)return alert('❌ DUPLICATE NIC! Already registered to: '+dup.full+' ('+dup.no+')');

  let customerData = {
    group: cGroup.value, title: cTitle.value, full: cFull.value.trim(), other: cOther.value,

    addr: cAddr.value, dob: cDob.value, gender: cGender.value, marital: cMar.value
  };

  try {

      // UPDATE existing customer
      await appDataRef.child('customers').child(editCid).update(customerData);
      editCid=null;
      alert('✅ Customer updated!');
    } else {
      // CREATE new customer
      const newId = uid();
      customerData.id = newId;
      customerData.no = nextCustNo();
      customerData.joined = today();
      await appDataRef.child('customers').child(newId).set(customerData);
      alert('✅ Customer created!');
    }
    await loadAllAppDataFromFirebase(); // Reload data after update/create
    nav('customers',navBtn('Customers'));
  } catch (error) {
    console.error("Error saving customer to Firebase:", error);
    alert("Failed to save customer: " + error.message);
  }
}

async function delCustomer(id){
  if(!isAdmin())return alert('❌ Only Admin can delete');
  const c=customers.find(x=>x.id===id);if(!c)return;
  const cl=loans.filter(l=>l.customerId===id);
  let msg='Delete customer '+c.no+' - '+c.full+' permanently?';
  if(cl.length)msg+='\n\n⚠️ This will ALSO DELETE '+cl.length+' loan(s) and all payments!';
  if(cl.some(l=>l.status!=='settled'))msg+='\n🔴 WARNING: has UNSETTLED loans!';
  if(!confirm(msg))return;
  if(!adminPassOK())return;

  try {
    const lids = cl.map(l => l.id);
    // Delete payments related to these loans
    for (const p of payments.filter(p_item => lids.includes(p_item.loanId))) {
      await appDataRef.child('payments').child(p.id).remove();
    }
    // Delete loans
    for (const lid of lids) {
        await appDataRef.child('loans').child(lid).remove();
    }
    // Delete customer
    await appDataRef.child('customers').child(id).remove();

    await loadAllAppDataFromFirebase(); // Reload data after deletions
    alert('🗑️ Deleted.');
    nav('customers',navBtn('Customers'));
  } catch (error) {
    console.error("Error deleting customer and related data from Firebase:", error);
    alert("Failed to delete customer: " + error.message);
  }
}

/* ============ LOAN CALC (% per month + weekly day) ============ */
function addPeriod(d,type){const x=new Date(d);if(type==='daily')x.setDate(x.getDate()+1);else if(type==='weekly')x.setDate(x.getDate()+7);else x.setMonth(x.getMonth()+1);return x.toISOString().slice(0,10)}
function installmentsFor(months,type){return type==='daily'?months*30:type==='weekly'?months*4:months}
function buildSchedule(P,monthlyRate,n,type,method,stream,start,months,weekDay){
  const perYear=type==='daily'?365:type==='weekly'?52:12;
  const wd=(weekDay===''||weekDay==null)?null:+weekDay;
  const step=d=>{
    if(type==='weekly'&&wd!==null){const x=new Date(d);do{x.setDate(x.getDate()+1)}while(x.getDay()!==wd);return x.toISOString().slice(0,10)}
    return addPeriod(d,type);
  };
  let rows=[],d=start,bal=P;
  if(method==='flat'){
    const totInt=P*(monthlyRate/100)*months;
    for(let k=1;k<=n;k++){d=step(d);let cap=0,int=0;
      if(stream==='Regular'){cap=P/n;int=totInt/n}
      else if(stream==='Interest'){int=totInt/n;cap=(k===n)?P:0}
      else{cap=P/n;int=(k===n)?totInt:0}
      rows.push({no:k,date:d,cap,int,total:cap+int});}
  }else{
    const i=(monthlyRate/100)*12/perYear;
    if(method==='rb_rental'){
      const pmt=i===0?P/n:P*i/(1-Math.pow(1+i,-n));
      for(let k=1;k<=n;k++){d=step(d);const int=bal*i;const cap=(k===n)?bal:pmt-int;bal-=cap;rows.push({no:k,date:d,cap,int,total:cap+int});}
    }else{
      const cap=P/n;
      for(let k=1;k<=n;k++){d=step(d);const int=bal*i;bal-=cap;rows.push({no:k,date:d,cap,int,total:cap+int});}
    }
  }
  return rows;
}

  const newId=uid();
  const newLoan = {id:newId,no:'LN'+String(loans.length+1).padStart(4,'0'),customerId:lCust.value,productId:isManual()?'manual':lProd.value,amount:v.P,rate:v.rate,n:v.n,months:v.months,

  try {

async function delLoan(id){
  if(!isAdmin())return alert('❌ Only Admin can delete');
  const l=loans.find(x=>x.id===id);if(!l)return;
  const pc=payments.filter(p=>p.loanId===id).length;
  if(!confirm('Delete loan '+l.no+'?'+(pc?'\n⚠️ Also deletes '+pc+' receipt(s)!':'')))return;
  if(!adminPassOK())return;
  
  try {
    // Delete related payments first
    const paymentsToDelete = payments.filter(p => p.loanId === id);
    for (const p of paymentsToDelete) {
        await appDataRef.child('payments').child(p.id).remove();
    }
    // Then delete the loan
    await appDataRef.child('loans').child(id).remove();
    await loadAllAppDataFromFirebase(); // Reload data after deletions
    alert('🗑️ Deleted.');
    nav('loans',navBtn('Loans'));
  } catch (error) {
    console.error("Error deleting loan and payments from Firebase:", error);
    alert("Failed to delete loan: " + error.message);
  }
}
async function approveLoan(id){
  const l=loans.find(x=>x.id===id);
  if((cur.limit||0)<l.amount)return alert(`❌ Your approval limit is ${fmt(cur.limit||0)}. This loan (${fmt(l.amount)}) exceeds it.`);
  
  try {
    await appDataRef.child('loans').child(l.id).update({status:'active', approvedBy:cur.name});
    await loadAllAppDataFromFirebase(); // Reload data after update
    alert('✅ Approved by '+cur.name);
    nav('loans',navBtn('Loans'));
  } catch (error) {
    console.error("Error approving loan in Firebase:", error);
    alert("Failed to approve loan: " + error.message);
  }
}

function waSend(phone,text){
  let p=(phone||'').toString().replace(/\D/g,'');
  if(!p)return alert('❌ Customer phone number missing!');
  if(p.startsWith('0'))p='94'+p.slice(1);
  if(!p.startsWith('94'))p='94'+p;
  const url='https://wa.me/'+p+'?text='+encodeURIComponent(text);
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();
}

function waLedger(id){
  const l=loans.find(x=>x.id===id);if(!l)return;

  const pays=payments.filter(p=>p.loanId===l.id);
  let bal=l.totalPayable,lines='';
  pays.forEach(p=>{bal-=p.amount;lines+=`${p.date} | ${p.receiptNo} | ${fmt(p.amount)} | Bal: ${fmt(bal)}\n`});

  waSend(c.phone,t);
}

function nextDue(l){let cum=0;for(const r of l.schedule){cum+=r.total;if(l.paid<cum-0.01)return{date:r.date,amount:cum-l.paid>r.total?r.total:cum-l.paid}}return null}
function loanOptions(filter){
  let act=loans.filter(l=>l.status==='active');
  if(filter){const q=filter.toLowerCase(),qn=normNic(filter);
    act=act.filter(l=>{const c=customers.find(x=>x.id===l.customerId);if(!c)return false;
      return normNic(c.nic).includes(qn)||(c.full||'').toLowerCase().includes(q)||(c.no||'').toLowerCase().includes(q)||(c.phone||'').includes(filter)})}
  return act.map(l=>{const c=customers.find(x=>x.id===l.customerId);
    return `<option value="${l.id}">${l.no} | ${c?esc(c.no):''} ${c?esc(c.full):''} (Bal: ${fmt(l.totalPayable-l.paid)})</option>`}).join('');
}

function payFilter(){payLoan.innerHTML=loanOptions(payNic.value.trim());payPick()}
function payPick(){
  const sel=document.getElementById('payLoan');if(!sel)return;
  const l=loans.find(x=>x.id===sel.value);
  if(!l){payInfo.innerHTML='';payArrears.innerHTML='';if(payAmt)payAmt.value='';return}
  const nd=nextDue(l);const ar=arrearsOf(l);
  payArrears.innerHTML=ar>0?`<div class="arrearsBox">🔴 ARREARS (OVERDUE): ${fmt(ar)}</div>`:'';
  payInfo.innerHTML=nd?`Next due <b>${nd.date}</b> — amount <b>${fmt(nd.amount)}</b>`:'';
  if(payAmt)payAmt.value=ar>0?ar.toFixed(2):(nd?nd.amount.toFixed(2):'');

async function addPayment(){
  const l=loans.find(x=>x.id===payLoan.value);const amt=+payAmt.value;
  if(!l||!amt||amt<=0)return alert('Select loan & enter amount');
  if(amt>l.totalPayable-l.paid+0.01)return alert('Amount exceeds balance ('+fmt(l.totalPayable-l.paid)+')');
  
  const updatedPaid = l.paid + amt;
  const newStatus = updatedPaid >= l.totalPayable - 0.01 ? 'settled' : 'active';
  
  const newId = uid();
  const rec={id:newId,receiptNo:'RCP'+String(payments.length+1).padStart(5,'0'),loanId:l.id,amount:amt,date:today(),
    method:payMethod.value,remark:payRemark.value,by:cur.name};

  try {
    // Update loan details
    await appDataRef.child('loans').child(l.id).update({paid: updatedPaid, status: newStatus});
    // Add new payment
    await appDataRef.child('payments').child(newId).set(rec);
    await loadAllAppDataFromFirebase(); // Reload data after update/add
    printReceipt(rec.id);
    nav('payments',navBtn('Payments'));
  } catch (error) {
    console.error("Error saving payment to Firebase:", error);
    alert("Failed to save payment: " + error.message);
  }
}
async function delPaymentRow(id){
  if(!isAdmin())return alert('❌ Only Admin can delete');
  const p=payments.find(x=>x.id===id);if(!p)return;
  const l=loans.find(x=>x.id===p.loanId);
  const c=l&&customers.find(x=>x.id===l.customerId);
  if(!confirm('Delete receipt '+p.receiptNo+'?\nCustomer: '+(c?c.full:'')+'\nAmount: '+fmt(p.amount)+'\n\nLoan balance will be adjusted back.'))return;
  if(!adminPassOK())return;
  
  try {
    if(l){
        const updatedPaid = Math.max(0, l.paid - p.amount);
        const newStatus = l.status === 'settled' && updatedPaid < l.totalPayable - 0.01 ? 'active' : l.status;
        await appDataRef.child('loans').child(l.id).update({paid: updatedPaid, status: newStatus});
    }
    await appDataRef.child('payments').child(id).remove();
    await loadAllAppDataFromFirebase(); // Reload data after deletions
    alert('🗑️ Deleted & balance adjusted.');
    nav('payments',navBtn('Payments'));
  } catch (error) {
    console.error("Error deleting payment from Firebase:", error);
    alert("Failed to delete payment: " + error.message);
  }
}

function pgDue(){

      ${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${todayWd===d?'selected':''}>${DAYS[d]}${todayWd===d?' — TODAY':''}</option>`).join('')}
    </select></div></div>
    <div id="dueOut"></div></div>`;

function renderDue(){
  const sel=document.getElementById('dueDay');if(!sel)return;
  const wd=+sel.value;
  const out=document.getElementById('dueOut');
  const rows=[];
  loans.filter(l=>l.status==='active').forEach(l=>{
    const nd=nextDue(l);if(!nd)return;
    const isWeeklyDay=(l.type==='weekly'&&l.weekDay!==''&&l.weekDay!=null&&+l.weekDay===wd);
    const ndDay=new Date(nd.date).getDay()===wd;
    const overdue=nd.date<=today();
    if(isWeeklyDay||ndDay||overdue){
      const c=customers.find(x=>x.id===l.customerId);
      rows.push({l,c,nd,ar:arrearsOf(l),overdue});
    }
  });
  rows.sort((a,b)=>(b.overdue?1:0)-(a.overdue?1:0));
  const tot=rows.reduce((s,r)=>s+r.nd.amount,0);
  const totAr=rows.reduce((s,r)=>s+r.ar,0);
  out.innerHTML=`
  <div class="grid g3" style="margin:12px 0">
    <div class="stat"><div class="v">${rows.length}</div><div class="l">Customers — ${DAYS[wd]} + Overdue</div></div>
    <div class="stat green"><div class="v">${fmt(tot)}</div><div class="l">Total to Collect</div></div>
    <div class="stat red"><div class="v">${fmt(totAr)}</div><div class="l">⚠️ Total Arrears</div></div>
  </div>
  <div style="text-align:right;margin-bottom:8px">${xlsBtn('tblDueDay','due-'+DAYS[wd])}

  <table id="tblDueDay"><tr><th>Cust No</th><th>Customer</th><th>Phone</th><th>Loan No</th><th>Next Due</th><th>Installment</th><th>Arrears</th><th>Balance</th><th>Status</th><th></th></tr>
  ${rows.map(r=>`<tr><td>${esc(r.c?r.c.no:'')}</td><td><b>${esc(r.c?r.c.full:'')}</b></td><td>${esc(r.c?r.c.phone:'')}</td>
  <td>${r.l.no}</td><td>${r.nd.date}</td><td><b>${fmt(r.nd.amount)}</b></td>
  <td>${r.ar>0?`<b style="color:var(--bad)">${fmt(r.ar)}</b>`:'-'}</td>
  <td>${fmt(r.l.totalPayable-r.l.paid)}</td>
  <td>${r.nd.date<today()?'<span class="badge b-over">OVERDUE</span>':r.nd.date===today()?'<span class="badge b-pending">DUE TODAY</span>':'<span class="badge b-active">'+DAYS[wd].slice(0,3).toUpperCase()+'</span>'}</td>
  <td><button class="btn green sm" onclick="goPay('${r.l.id}')">💰 Pay</button></td></tr>`).join('')||'<tr><td colspan=10>😊 No customers due</td></tr>'}
  <tr><td colspan=5 style="text-align:right"><b>TOTAL</b></td><td><b>${fmt(tot)}</b></td><td><b style="color:var(--bad)">${fmt(totAr)}</b></td><td colspan=3></td></tr></table>`;
}

function runProfit(){
  const list=loans.filter(l=>l.status!=='pending'&&l.start>=pfFrom.value&&l.start<=pfTo.value);
  let tInt=0,tDoc=0,tOther=0,tExp=0,tReal=0;
  const rows=list.map(l=>{

    const int=l.totalPayable-l.amount;
    const expected=int+(l.docCharge||0)+(l.otherCharge||0);
    const realized=(l.totalPayable?int*(l.paid/l.totalPayable):0)+(l.docCharge||0)+(l.otherCharge||0);
    tInt+=int;tDoc+=l.docCharge||0;tOther+=l.otherCharge||0;tExp+=expected;tReal+=realized;
    return `<tr><td><b>${l.no}</b></td><td>${l.start}</td><td>${c?esc(c.no)+' '+esc(c.full):''}</td><td>${fmt(l.amount)}</td>
    <td>${fmt(int)}</td><td>${fmt(l.docCharge)}</td><td>${fmt(l.otherCharge)}</td>
    <td>${fmt(expected)}</td><td>${fmt(realized)}</td>

  <div class="grid g4" style="margin:14px 0">
    <div class="stat green"><div class="v">${fmt(tExp)}</div><div class="l">Expected Profit</div></div>
    <div class="stat green"><div class="v">${fmt(tReal)}</div><div class="l">Realized Profit</div></div>
    <div class="stat"><div class="v">${fmt(tInt)}</div><div class="l">Total Interest</div></div>
    <div class="stat"><div class="v">${fmt(tDoc+tOther)}</div><div class="l">Charges</div></div>
  </div>

  <table id="tblProfit"><tr><th>Loan No</th><th>Date</th><th>Customer</th><th>Amount</th><th>Interest</th><th>Doc</th><th>Other</th><th>Expected</th><th>Realized</th><th>Status</th></tr>
  ${rows||'<tr><td colspan=10>No loans</td></tr>'}
  <tr><td colspan=4 style="text-align:right"><b>TOTALS</b></td><td><b>${fmt(tInt)}</b></td><td><b>${fmt(tDoc)}</b></td><td><b>${fmt(tOther)}</b></td><td><b>${fmt(tExp)}</b></td><td><b>${fmt(tReal)}</b></td><td></td></tr></table>
  <button class="btn gray" style="margin-top:6px" onclick="window.print()">🖨️ Print</button>`;
}
function pgOfficer(){
  const m=today().slice(0,7);
  return `<div class="card"><h3 class="sec">🎯 Officer Target / Performance</h3><div class="grid g3">

    <div style="align-self:end"><button class="btn" onclick="runOfficer()">Generate</button></div></div>

function runOfficer(){
  const f=ofFrom.value,t=ofTo.value;
  const perf={};
  loans.filter(l=>l.start>=f&&l.start<=t&&l.status!=='pending').forEach(l=>{
    const k=l.createdBy||'Unknown';perf[k]=perf[k]||{loans:0,loanAmt:0,cols:0,colAmt:0};
    perf[k].loans++;perf[k].loanAmt+=l.amount;});
  payments.filter(p=>p.date>=f&&p.date<=t).forEach(p=>{
    const k=p.by||'Unknown';perf[k]=perf[k]||{loans:0,loanAmt:0,cols:0,colAmt:0};
    perf[k].cols++;perf[k].colAmt+=p.amount;});
  let tL=0,tLA=0,tC=0,tCA=0;
  const rows=Object.keys(perf).map(k=>{
    const v=perf[k];tL+=v.loans;tLA+=v.loanAmt;tC+=v.cols;tCA+=v.colAmt;
    const u=users.find(x=>x.name===k);
    return `<tr><td><b>${esc(k)}</b></td><td>${u?u.role:'-'}</td><td>${v.loans}</td><td>${fmt(v.loanAmt)}</td><td>${v.cols}</td><td>${fmt(v.colAmt)}</td></tr>`}).join('');
  ofOut.innerHTML=`
  <div style="text-align:right;margin:12px 0 8px">${xlsBtn('tblOfficer','officer-report')}</div>
  <table id="tblOfficer"><tr><th>Officer</th><th>Role</th><th>Loans Issued</th><th>Loan Amount</th><th>Receipts</th><th>Collected</th></tr>
  ${rows||'<tr><td colspan=6>No activity</td></tr>'}
  <tr><td colspan=2 style="text-align:right"><b>TOTALS</b></td><td><b>${tL}</b></td><td><b>${fmt(tLA)}</b></td><td><b>${tC}</b></td><td><b>${fmt(tCA)}</b></td></tr></table>
  <button class="btn gray" style="margin-top:10px" onclick="window.print()">🖨️ Print</button>`;
}

/* ============ USERS (Firebase integrated) ============ */
function pgUsers(){
  const admin=isAdmin();
  const pendingUsers = users.filter(u => u.status === 'pending');
  // For approvedUsers, include those with 'approved' status or no status (implying legacy approved)
  const approvedUsers = users.filter(u => u.status === 'approved' || !u.status);

  let html = '';

  if (admin && pendingUsers.length > 0) {
    html += `<div class="card"><div class="secrow"><h3>Pending User Approvals (${pendingUsers.length})</h3></div>
    <table id="tblPendingUsers"><tr><th>Name</th><th>Username (Email)</th><th>Actions</th></tr>
    ${pendingUsers.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td>
    <td><button class="btn green sm" onclick="approveUser('${u.id}')">✅ Approve</button>
    <button class="btn red sm" onclick="rejectUser('${u.id}')">❌ Reject</button></td></tr>`).join('')}</table></div>`;
  }

  html += `<div class="card"><div class="secrow"><h3>System Users</h3>${xlsBtn('tblUsers','users')}</div>
  <table id="tblUsers"><tr><th>Name</th><th>Username (Email)</th><th>Role</th><th>Approval Limit</th><th>Status</th><th></th></tr>
  ${approvedUsers.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username)}</td>
  <td>${admin?`<select onchange="setRole('${u.id}',this.value)" style="margin:0"><option ${u.role==='Admin'?'selected':''}>Admin</option><option ${u.role==='Manager'?'selected':''}>Manager</option><option ${u.role==='Officer'?'selected':''}>Officer</option></select>`:u.role}</td>
  <td>${admin?`<input type="number" value="${u.limit||0}" style="width:140px;margin:0" onchange="setLimit('${u.id}',this.value)">`:fmt(u.limit||0)}</td>
  <td><span class="badge b-${u.status === 'approved' || !u.status ? 'settled' : (u.status === 'pending' ? 'pending' : 'bad')}">${u.status ? u.status.toUpperCase() : 'APPROVED'}</span></td>
  <td>${admin&&cur&&u.id!==cur.uid?`<button class="btn red sm" onclick="delUser('${u.id}')">🗑️</button>`:''}</td></tr>`).join('')}</table></div>`;
  
  return html;
}

async function setRole(id, v){
  if(!isAdmin())return;
  if(!adminPassOK()) return; // Admin password confirmation
  try {
    await usersDbRef.child(id).update({ role: v });
    if (v === 'Admin') { // If setting to Admin, also set high limit
        await usersDbRef.child(id).update({ limit: 999999999 });
    }
    await syncUsersFromFirebase(); // Refresh local users array
    alert('User role updated!');
    nav('users', navBtn('Users')); // Refresh UI
  } catch (error) {
    alert('Error updating role: ' + error.message);
  }
}

async function setLimit(id, v){
  if(!isAdmin())return;
  if(!adminPassOK()) return; // Admin password confirmation
  try {
    await usersDbRef.child(id).update({ limit: +v });
    await syncUsersFromFirebase(); // Refresh local users array
    alert('User limit updated!');
    nav('users', navBtn('Users')); // Refresh UI
  } catch (error) {
    alert('Error updating limit: ' + error.message);
  }
}

async function approveUser(id) {
  if (!isAdmin()) return alert('❌ Only Admin can approve users.');
  if (!adminPassOK()) return;

  try {
    await usersDbRef.child(id).update({ status: 'approved' });
    await syncUsersFromFirebase();
    alert('✅ User approved!');
    nav('users', navBtn('Users')); // Refresh UI
  } catch (error) {
    alert('Error approving user: ' + error.message);
  }
}

async function rejectUser(id) {
  if (!isAdmin()) return alert('❌ Only Admin can reject users.');
  if (!confirm('Are you sure you want to reject and delete this user? This cannot be undone.')) return;
  if (!adminPassOK()) return;

  try {
    // Delete user's profile from Realtime DB
    await usersDbRef.child(id).remove();
    // Note: To completely delete from Firebase Auth, Admin SDK is needed (server-side).
    // Client-side can only delete current user's Auth account, not others.
    await syncUsersFromFirebase();
    alert('❌ User rejected and profile deleted.');
    nav('users', navBtn('Users')); // Refresh UI
  } catch (error) {
    alert('Error rejecting user: ' + error.message);
  }
}


async function delUser(id){
  if(!isAdmin())return alert('❌ Only Admin can delete users');
  if(!confirm('Permanently delete this user profile from the database? (Note: The Firebase Authentication user account may persist unless deleted via Firebase Console or Admin SDK)'))return;
  if(!adminPassOK())return;

  try {
    // We can only delete the user's profile from Realtime DB client-side.
    // Deleting the Firebase Auth user account requires server-side Admin SDK or re-authentication of the target user.
    await usersDbRef.child(id).remove();
    await syncUsersFromFirebase(); // Refresh local users array
    alert('🗑️ User profile deleted from database.');
    nav('users', navBtn('Users'));
  } catch (error) {
    alert('Error deleting user profile: ' + error.message);
  }
}

async function saveSettings(){
  const updatedSettings = {
    company: setCo.value,
    address: setAddr.value,
    phone: setPh.value,
    logo: settings.logo || '' // Keep existing logo if no new file selected
  };

  const f=setLogo.files[0];
  if(f){
    const r=new FileReader();
    r.onload=async e=>{
      updatedSettings.logo=e.target.result;
      try {
        await appDataRef.child('settings').set(updatedSettings);
        await loadAllAppDataFromFirebase(); // Reload data after update
        applyBrand(); // Apply brand AFTER settings are loaded from Firebase
        alert('Saved!');
        nav('settings',navBtn('Settings'));
      } catch (error) {
        console.error("Error saving settings with logo to Firebase:", error);
        alert("Failed to save settings: " + error.message);
      }
    };
    r.readAsDataURL(f);
  } else {
    try {
      await appDataRef.child('settings').set(updatedSettings);
      await loadAllAppDataFromFirebase(); // Reload data after update
      applyBrand(); // Apply brand AFTER settings are loaded from Firebase
      alert('Saved!');
      nav('settings',navBtn('Settings'));
    } catch (error) {
      console.error("Error saving settings to Firebase:", error);
      alert("Failed to save settings: " + error.message);
    }
  }
}

async function backup(){
  try {
    const appDataSnapshot = await appDataRef.once('value');
    const usersSnapshot = await usersDbRef.once('value');

    const backupData = {
      appData: appDataSnapshot.val(),
      users: usersSnapshot.val()
    };

    const blob=new Blob([JSON.stringify(backupData)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loan-backup-'+today()+'.json';a.click();
    alert('✅ All application data and user profiles downloaded!');
  } catch (error) {
    console.error("Error creating backup:", error);
    alert("Failed to create backup: " + error.message);
  }
}

function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=async e=>{
    try{
      const d=JSON.parse(e.target.result);
      if (d.appData) {
          await appDataRef.set(d.appData); // Overwrite app data
          alert('✅ Application data (groups, customers, loans, etc.) restored!');
      } else {
          alert('❌ No application data found in backup file to restore.');
      }
      
      // For users, it's generally NOT safe to overwrite client-side
      if (d.users) {
          alert('⚠️ User profiles found in backup. Restoring user profiles via client-side is not recommended for security and integrity. Please manage users directly in Firebase Console or use Admin SDK.');
      }

      await loadAllAppDataFromFirebase(); // Reload local data from Firebase
      await syncUsersFromFirebase(); // Reload user data
      location.reload();

    }catch(error){
      console.error("Error restoring backup:", error);
      alert('Invalid backup file or failed to restore: ' + error.message);
    }
  };
  r.readAsText(f);
}

async function fullClear(){
  if(!isAdmin())return alert('❌ Only Admin');
  if(!confirm('⚠️ CONFIRM 1 of 3\n\nDELETE EVERYTHING: Customers, Loans, Payments, Products, Groups, Users, Settings.\n\nContinue?'))return;
  if(!confirm('⚠️ CONFIRM 2 of 3\n\nALL DATA LOST FOREVER. Backup ekak gaththada?\n\nContinue?'))return;
  if(!confirm('🔴 FINAL CONFIRM 3 of 3\n\n100% SURE? CANNOT be undone!'))return;
  if(!adminPassOK())return;
  
  try {
    // Clear all application data
    await appDataRef.remove();
    // Clear all user profiles (from Realtime DB, Auth users remain unless deleted via console/Admin SDK)
    await usersDbRef.remove();

    // Sign out current user
    await firebase.auth().signOut();
    
    alert('🗑️ ALL DATA CLEARED (Firebase appData & user profiles). You are now logged out.');
    location.reload();
  } catch (error) {
    console.error("Error during full clear:", error);
    alert('❌ Failed to clear all data: ' + error.message);
  }
}

// Initial call to applyBrand() when the script loads, before Firebase has fully initialized.
// This ensures default branding is shown immediately.
document.addEventListener('DOMContentLoaded', () => {
    // This initial call will use the hardcoded default settings, or whatever is fetched quickly.
    // The onAuthStateChanged listener will then fetch and apply the saved settings from Firebase.
    applyBrand(); 

    // Add event listener for 'Enter' key on username and password fields
    const liUser = document.getElementById('liUser');
    const liPass = document.getElementById('liPass');
    
    // Function to handle Enter key login
    const handleLoginEnter = (event) => {
        if (event.key === 'Enter' || event.keyCode === 13) {
            event.preventDefault(); // Prevent default form submission behavior
            console.log('Enter key pressed, attempting login.');
            login();
        }
    };

    if (liUser) {
        liUser.addEventListener('keydown', handleLoginEnter);
    }

    if (liPass) {
        liPass.addEventListener('keydown', handleLoginEnter);
    }
});
